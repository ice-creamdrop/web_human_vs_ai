<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>황새 오래걷기 : AI vs 인간 맞다이</title>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body {
            background-color: #1e1e2e;
            color: #ffffff;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            user-select: none;
        }
        h2 {
            margin: 5px 0 12px 0;
        }
        .control-panel {
            background: #2b2b40;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-wrap: wrap;
        }
        .control-panel label {
            cursor: pointer;
            font-weight: bold;
            padding: 7px 12px;
            border-radius: 6px;
            background: #3b3b54;
            font-size: 14px;
            transition: background 0.2s;
        }
        .control-panel label:hover {
            background: #4b4b6a;
        }
        .control-panel input[type="radio"] {
            display: none;
        }
        .control-panel input[type="radio"]:checked + span {
            color: #4ade80;
        }
        .btn-ready {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-ready:hover {
            background: #2563eb;
        }
        .stage-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .game-box {
            background: #000;
            border: 3px solid #4a4a6a;
            border-radius: 8px;
            padding: 5px;
            position: relative;
            width: 550px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 13px;
            z-index: 10;
            pointer-events: none;
        }
        .badge.ai { color: #f87171; border: 1px solid #f87171; }
        .badge.human { color: #60a5fa; border: 1px solid #60a5fa; }
        #ai-wait-msg {
            color: #facc15;
            font-size: 16px;
            font-weight: bold;
            position: absolute;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2>🦩 황새 오래걷기 : 강화학습(PPO) AI vs 인간</h2>

    <!-- 1. 난이도(체크포인트 모델) 선택 및 리셋 패널 -->
    <div class="control-panel">
        <span>🤖 AI 난이도:</span>
        
        <!-- 보유하신 체크포인트 파일 이름에 맞게 value를 수정하세요 -->
        <label>
            <input type="radio" name="model" value="stork_ai_16384_steps" onchange="changeModel(this.value)">
            <span>초급 (1.6만)</span>
        </label>
        <label>
            <input type="radio" name="model" value="stork_ai_32768_steps" checked onchange="changeModel(this.value)">
            <span>중급 (3.2만)</span>
        </label>
        <label>
            <input type="radio" name="model" value="stork_ai_65536_steps" onchange="changeModel(this.value)">
            <span>고급 (6.5만)</span>
        </label>
        <label>
            <input type="radio" name="model" value="ppo_human_300k" onchange="changeModel(this.value)">
            <span>마스터 (30만)</span>
        </label>

        <button class="btn-ready" onclick="prepareNextMatch()">🔄 새 판 준비 (단축키: R)</button>
        <span id="status-msg" style="color: #4ade80; font-size: 14px; font-weight: bold;">서버 연결 대기중...</span>
    </div>

    <!-- 2. 상하단 게임 화면 -->
    <div class="stage-container">
        <!-- 위쪽: AI 플레이어 -->
        <div class="game-box">
            <div class="badge ai">⬆️ AI 조종 (PPO 모델)</div>
            <div id="ai-wait-msg">
                ⬇️ 아래 인간 화면에서 <b>Spacebar</b>를 누르면<br>AI도 0m부터 동시에 출발합니다!
            </div>
            <div id="ai-swf"></div>
        </div>

        <!-- 아래쪽: 인간 플레이어 -->
        <div class="game-box">
            <div class="badge human">⬇️ 인간 조종 (화면 클릭 후 Spacebar로 시작 / 방향키 조작)</div>
            <div id="human-swf"></div>
        </div>
    </div>

    <script>
        let aiPlayer = null;
        let humanPlayer = null;
        let controlSocket = null;
        let isMatchRunning = false; // 게임 도중 실수로 Spacebar를 눌러도 리셋되지 않게 막는 잠금 변수

        // 파이썬 제어 서버(8766) 연결
        function connectControlServer() {
            controlSocket = new WebSocket("ws://127.0.0.1:8766");
            controlSocket.onopen = () => {
                document.getElementById("status-msg").innerText = "🟢 대기중 (아래 창에서 Spacebar를 누르세요)";
            };
            controlSocket.onmessage = (event) => {
                if (event.data.startsWith("LOADED:")) {
                    const modelName = event.data.split(":")[1];
                    document.getElementById("status-msg").innerText = `🔄 [${modelName}] 적용 완료!`;
                }
            };
            controlSocket.onclose = () => {
                document.getElementById("status-msg").innerText = "🔴 파이썬 서버(server.py) 끊김";
            };
        }

        // 라디오 버튼 클릭 시 AI 모델 변경
        function changeModel(modelName) {
            if (controlSocket && controlSocket.readyState === WebSocket.OPEN) {
                controlSocket.send("MODEL:" + modelName);
            }
            // 모델 변경 후에도 인간 플레이어 창에 포커스 유지
            if (humanPlayer) humanPlayer.focus();
        }

        // 스페이스바를 누르는 순간 위쪽 AI SWF를 새로 로드하여 즉시 출발시키는 함수
        function startAiNow() {
            const waitMsg = document.getElementById("ai-wait-msg");
            if (waitMsg) waitMsg.style.display = "none";

            const aiContainer = document.getElementById("ai-swf");
            aiContainer.innerHTML = "";

            const ruffle = window.RufflePlayer.newest();
            aiPlayer = ruffle.createPlayer();
            aiPlayer.style.width = "550px";
            aiPlayer.style.height = "320px";
            aiContainer.appendChild(aiPlayer);

            aiPlayer.load({
                // ?t=시간 파라미터로 브라우저 캐시를 무시하고 수정된 최신 SWF를 즉시 불러옴
                url: "stork_ai.swf?t=" + new Date().getTime(),
                autoplay: "on",
                unmuteOverlay: "hidden",
                socketProxy: [
                    {
                        host: "127.0.0.1",
                        // ⚠️ 중요: 본인의 stork_ai.swf 내부 XMLSocket 포트 번호와 똑같이 맞추세요!
                        port: 9999,
                        proxyUrl: "ws://127.0.0.1:8765"
                    }
                ]
            });
        }

        // 게임 오버 후 다음 판 동시 출발을 위해 잠금을 해제하는 함수
        function prepareNextMatch() {
            isMatchRunning = false;
            document.getElementById("status-msg").innerText = "🟢 새 판 준비 완료! Spacebar를 누르면 동시 출발합니다";
            if (humanPlayer) humanPlayer.focus();
        }

        // 페이지 로드 시 인간용 게임 먼저 세팅
        window.addEventListener("DOMContentLoaded", () => {
            connectControlServer();
            const ruffle = window.RufflePlayer.newest();

            humanPlayer = ruffle.createPlayer();
            humanPlayer.style.width = "550px";
            humanPlayer.style.height = "320px";
            document.getElementById("human-swf").appendChild(humanPlayer);
            humanPlayer.load({
                url: "stork_human.swf?t=" + new Date().getTime(),
                autoplay: "on",
                unmuteOverlay: "hidden"
            });

            setTimeout(() => {
                if (humanPlayer) humanPlayer.focus();
            }, 500);
        });

        // 키보드 이벤트 감지 (Spacebar 동시 시작 & R키 재시작 준비)
        window.addEventListener("keydown", (e) => {
            if (!e.isTrusted || e.repeat) return;

            // 1. 대기 상태일 때 Spacebar를 누르면 -> AI 즉시 로드 및 출발 + 잠금 설정
            if (e.code === "Space" && !isMatchRunning) {
                isMatchRunning = true;
                document.getElementById("status-msg").innerText = "🔥 대결 진행중! (죽은 뒤 새 판 준비는 R키)";

                if (controlSocket && controlSocket.readyState === WebSocket.OPEN) {
                    controlSocket.send("RESET");
                }
                
                startAiNow();

                // 포커스가 AI 창으로 뺏기지 않도록 인간 창에 고정
                setTimeout(() => {
                    if (humanPlayer) humanPlayer.focus();
                }, 30);
            }

            // 2. 죽고 나서 'R' 키를 누르면 -> 다시 Spacebar로 동시 출발할 수 있도록 잠금 해제
            if (e.code === "KeyR") {
                prepareNextMatch();
            }
        }, true);
    </script>
</body>
</html>
